[package]
name = "lambda-runtime-base"
description = "Unofficial blocking client for the AWS Lambda Runtime API: take one invocation at a time and answer it your way"
version = "0.1.0"
edition = "2024"
authors = ["insd47"]
license = "MIT"
repository = "https://github.com/insd47/lambda-runtime-base"
keywords = ["lambda", "aws", "runtime", "serverless", "streaming"]
categories = ["web-programming", "network-programming"]

[lints.clippy]
redundant_pub_crate = "warn"
self_named_module_files = "warn"

[dependencies]
base64 = "0.23"
httparse = "1"
serde = "1"
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
